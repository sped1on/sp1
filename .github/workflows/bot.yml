name: polybot

on:
  # schedule disabled 2026-08-21 -- GitHub's cron was firing far less often
  # than every 5 minutes (real gaps of 20-60+ min), unreliable for a bot that
  # needs to catch a signal within its 15-min window. Switched back to the
  # local bot on the PC (tick.py). Manual runs still work via workflow_dispatch
  # below if this ever needs re-testing.
  workflow_dispatch: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: polybot-tick
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install py_clob_client_v2
        run: pip install --quiet py_clob_client_v2
      - name: run bounded tick loop
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          THRESH_PCT: ${{ secrets.THRESH_PCT }}
          HOLD_MIN: ${{ secrets.HOLD_MIN }}
          MIN_ENTRY_DIST_PCT: ${{ secrets.MIN_ENTRY_DIST_PCT }}
          RISK_USD: ${{ secrets.RISK_USD }}
          MAX_ENTRY_PRICE: ${{ secrets.MAX_ENTRY_PRICE }}
          LIVE_TRADING: ${{ secrets.LIVE_TRADING }}
          LIVE_RISK_USD_START: ${{ secrets.LIVE_RISK_USD_START }}
          LIVE_RISK_USD_ESCALATED: ${{ secrets.LIVE_RISK_USD_ESCALATED }}
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_FUNDER: ${{ secrets.POLY_FUNDER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python tick_gh.py --loop-for 280
